task: 1
slug: menaphos_vip_fishing
name: "Menaphos VIP Fishing (Python bot)"
goal: >-
  Catch beltfish, desert sole, or catfish at the Menaphos VIP skilling
  area pool. Re-casts when the player stops animating, banks via
  preset 1 when the inventory fills up, and (optionally) checks the
  cursor tooltip before each click so a misclick on a similar colour
  can't sneak through.
location:
  region: "Menaphos VIP Skilling Area"
  coords: [3193, 2702]
  notes: |
    Logic lives in menaphos_vip_fishing.py. Thresholds and timings are
    constants near the top of each rule; ROIs and colours come from the
    global capture library, so you never paste coordinates into the
    file.

    This bot needs RS3 contrast mode. With it on, every interactable
    is drawn in one saturated cyan and your character in red, and the
    bot detects both by colour.

    IN-GAME SETUP
      - Menaphos reputation high enough for VIP area access.
      - Turn on contrast mode (Settings > Graphics > High contrast).
      - Fishing rod equipped or in inventory, bait in inventory.
      - Save Preset 1 as "empty inventory + bait". Test it: press 1 at
        the chest, confirm the inventory swaps and the bank closes.
      - Stand on the west side of the pool. Lock the camera and do not
        move it after taking captures.
      - Keyboard backend set to serial_hid with the Arduino connected.
        Every software keystroke path is filtered by NXT.

    CAPTURES (AI tab > Captures card, then Promote each to global)
      Required. The preflight rule stops the bot and lists anything
      missing.
        color     contrast_cyan     3 to 5 samples on cyan interactables
                                    (the pool, a tree, the chest)
        color     contrast_red      3 to 5 samples on your red character
        snapshot  bank_open_vip     bank window fully open
        roi       vip_pool_west     rect over the west half of the pool
        roi       vip_chest_search  rect that frames the bank chest

      Optional. Loaded when present, ignored when absent.
        snapshot  vip_spot_tooltip  the "Bait fishing spot" tooltip
                                    while hovering the spot
        snapshot  vip_chest_tooltip the "Bank chest" tooltip
        snapshot  inv_full          the red "inventory is too full"
                                    chat line (must contain the text,
                                    not empty chatbox chrome)

      Also run "Calibrate Inventory ROI" in the AI tab. Without it the
      inventory count is unknown and banking only triggers off the
      inv_full snapshot.

    RUN
      - The script sets dry_run=True. The app's dry-run toggle cannot
        override that; edit the script when you are ready for real
        input. Start it dry first and watch the log cycle through
        scanning, fishing, and banking.
      - If tooltip snapshots are present, the log prints the tooltip
        confidence on each recast.
      - Flip dry_run to False, run one 15 minute trip, confirm fish
        accumulate and a bank cycle completes.
      - A 90 minute unattended run confirms the watchdog stops the bot
        when bait runs out (looks like clicking the spot with no
        animation following).

    WATCHDOGS (set in the Bot(...) call)
      - auto_stop_dry_ticks=120: stop after 60 s at 2 Hz with no
        productive rule. The idle rule does not count.
      - watchdog_no_click_s=600: stop after 10 minutes with no input
        sent (clicks, keys, or drags).
phases: [scanning, fishing, banking]
success_signals: [detection_chain]
failure_signals: [no_match_5x, afk_watchdog, missing_capture]
params:
  monitor: 1
author: phantomclick
tags: [fishing, menaphos, vip-skilling-area, beltfish, desert-sole, catfish, python-bot]
bot:
  ref: "menaphos_vip_fishing.py"
